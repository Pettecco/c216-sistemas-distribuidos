[project]
name = "backend"
version = "0.1.0"
description = "Backend da primeira atividade de c216"
authors = [
    {name = "Pettecco",email = "petterson.ikaro@gec.inatel.br"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.4,<0.17.0)"
]

[tool.poetry]
package-mode=false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

